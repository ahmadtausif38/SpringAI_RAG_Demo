spring.application.name=SpringAI_RAG_Demo
server.port=8089

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.embedding.model=nomic-embed-text

# Postgres (Homebrew, port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/springai_rag
spring.datasource.username=tausifahmad
spring.datasource.password=

# pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# Print the final prompt sent to the LLM
logging.level.org.springframework.ai.chat.client.advisor=DEBUG